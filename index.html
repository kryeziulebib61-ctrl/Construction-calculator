<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17121d">
<title>BETA GROUP-cal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark">BG</div><div><h1>BETA GROUP-cal</h1><p>20+ formula • shpejt • saktë • praktike</p></div></div>
</header>

<main>
  <section class="intro">
    <h2>Formula ndërtimi</h2>
    <p>Zgjidh formulën, vendos dimensionet dhe merr rezultatin.</p>
  </section>
  <div id="formulaList"></div>
</main>

<nav class="bottom">
  <button class="active" data-nav="formulas">⌂<span>Formula</span></button>
  <button data-nav="favorites">☆<span>Të preferuara</span></button>
  <button data-nav="estimate">▣<span>Preventiv</span></button>
</nav>

<div id="drawer" class="drawer hidden">
  <div class="drawer-card">
    <button id="closeDrawer" class="close">×</button>
    <h2 id="drawerTitle"></h2><p id="drawerFormula"></p>
    <div id="fields"></div>
    <button id="calculate" class="calc">LLOGARIT</button>
    <div id="result"></div>
    <button id="addEstimate" class="add hidden">+ Shto në preventiv</button>
  </div>
</div>

<div id="estimate" class="estimate hidden">
  <div class="estimate-head"><button id="closeEstimate">←</button><div><h2>Preventiv</h2><p>BETA GROUP-cal</p></div></div>
  <div id="estimateRows"></div>
  <button id="newRow" class="add">+ Shto zë</button>
  <div class="grand"><span>TOTAL</span><b id="grandTotal">0.00 €</b></div>
  <button id="print" class="calc">PRINT / PDF</button>
</div>

<script src="app.js"></script>
</body>
</html>
